org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The pub cache (C:) and project (E:) are on different drives, which breaks
# Kotlin incremental caches on Windows ("different roots"). Full compiles only.
kotlin.incremental=false

# Low-RAM machine (8 GB) building on a removable drive: limit parallelism and
# avoid a separate Kotlin daemon process to keep peak memory down.
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
